version: "1"
packages:
  - name: "db"
    path: "internal/infrastructure/sqlc"
    schema: "./migrations/"
    queries: "internal/infrastructure/sqlc/queries/"
    engine: "postgresql"
    emit_json_tags: true
    emit_interface: true
    emit_exact_table_names: false
    emit_empty_slices: true
    sql_package: "pgx/v5"
